<!DOCTYPE html>
<html>
<head>
<title>AI Attendance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* ---------- DARK MODE DEFAULT ---------- */
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
text-align:center;
transition:0.4s;
}

/* LIGHT MODE */
body.light{
background:linear-gradient(135deg,#f1f5f9,#e2e8f0);
color:black;
}

/* TITLE */
h2{
margin-top:20px;
font-size:30px;
}

/* VIDEO */
.video-container{
display:flex;
justify-content:center;
margin-top:20px;
}

video{
width:380px;
border-radius:15px;
border:2px solid #38bdf8;
box-shadow:0 15px 40px rgba(0,0,0,0.7);
transition:0.3s;
}

body.light video{
border:2px solid #0ea5e9;
}

video:hover{
transform:scale(1.03);
box-shadow:0 20px 60px rgba(56,189,248,0.5);
}

/* BUTTONS */
.btn{
padding:14px 25px;
margin:15px;
border:none;
border-radius:30px;
font-size:16px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.btn-primary{
background:linear-gradient(135deg,#22c55e,#4ade80);
color:white;
}

.btn-secondary{
background:linear-gradient(135deg,#38bdf8,#0ea5e9);
color:white;
}

.btn:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 15px 30px rgba(0,0,0,0.6);
}

.btn:active{
transform:scale(0.95);
}

/* RESULT */
#result{
margin-top:20px;
font-size:18px;
padding:10px;
background:rgba(255,255,255,0.05);
display:inline-block;
border-radius:10px;
}

/* CARD */
.container{
margin:auto;
margin-top:30px;
padding:30px;
width:450px;
border-radius:20px;
background:linear-gradient(145deg,#1e293b,#020617);
box-shadow:0 20px 50px rgba(0,0,0,0.7);
transition:0.4s;
}

body.light .container{
background:linear-gradient(145deg,#ffffff,#e2e8f0);
color:black;
}

.sub{
opacity:0.7;
font-size:14px;
}

/* TOGGLE BUTTON */
.toggle{
position:absolute;
top:20px;
right:20px;
padding:10px 15px;
border-radius:20px;
border:none;
cursor:pointer;
background:#38bdf8;
color:white;
font-weight:bold;
}

</style>
</head>

<body>

<button class="toggle" onclick="toggleMode()">🌙 / ☀ Mode</button>

<h2>🤖 AI Face Attendance</h2>
<p class="sub">Smart Recognition System</p>

<div class="container">

<div class="video-container">
<video id="video" autoplay></video>
</div>

<!-- STEP 1 -->
<button class="btn btn-primary" onclick="capture()">📸 Scan Face</button>

<!-- STEP 2 -->
<button class="btn btn-secondary" onclick="confirmAttendance()">⚡ Confirm Attendance</button>

<p id="result"></p>

</div>
<script>

const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => video.srcObject = stream)
.catch(()=>alert("Camera blocked"));

let capturedImage = "";

/* ---------- DARK / LIGHT MODE ---------- */
function toggleMode(){
    document.body.classList.toggle("light");
}

/* ---------- CAPTURE ---------- */
function capture(){
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    capturedImage = canvas.toDataURL("image/jpeg");

    document.getElementById("result").innerText =
        "📸 Face Captured. Now click Confirm Attendance";
}

/* ---------- FIXED FLOW ---------- */
function confirmAttendance(){

    if(!capturedImage){
        alert("Please scan face first");
        return;
    }

    document.getElementById("result").innerText = "⏳ Processing...";

    let formData = new FormData();
    formData.append("image", capturedImage);

    fetch("/recognize", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {

        console.log("Recognize:", data);

        if(!data.name){
            document.getElementById("result").innerText =
                "❌ Face not recognized. Try better lighting.";
            return;
        }

        // ✅ IMPORTANT: RETURN FETCH
        return fetch("/attendance", {
            method: "POST",
            headers: {"Content-Type":"application/x-www-form-urlencoded"},
            body: new URLSearchParams({
                name: data.name
            })
        });

    })
    .then(res => {
        if(!res) return;
        return res.json();
    })
    .then(data => {
        if(data){
            document.getElementById("result").innerText =
                "✅ " + data.msg;
        }
    })
    .catch(err => {
        console.log(err);
        document.getElementById("result").innerText =
            "❌ Error occurred";
    });

}

</script>

</body>
</html>
