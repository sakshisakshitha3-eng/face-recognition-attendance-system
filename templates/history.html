<!DOCTYPE html>
<html>
<head>
<title>History</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
}

.container{padding:30px;}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.toggle{
padding:10px;
border:none;
border-radius:20px;
background:#38bdf8;
cursor:pointer;
}

.search{
padding:10px;
border-radius:10px;
border:none;
width:250px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}


table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th, td{
padding:10px;
text-align:center;
}

th{
background:#38bdf8;
color:black;
}

tr:hover{
background:rgba(56,189,248,0.2);
}

.stats{
display:flex;
gap:20px;
margin-bottom:20px;
}

.stat-box{
background:#111827;
padding:15px;
border-radius:10px;
flex:1;
text-align:center;
}
/* ===== ROYAL ACTION BUTTONS ===== */
.action-bar{
display:flex;
gap:15px;
margin-bottom:20px;
}

/* base style */
.royal-btn{
padding:12px 20px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
letter-spacing:0.5px;
transition:0.3s;
backdrop-filter: blur(10px);
box-shadow:0 8px 25px rgba(0,0,0,0.4);
position:relative;
overflow:hidden;
}

/* glow animation */
.royal-btn::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
transition:0.5s;
}

.royal-btn:hover::before{
left:100%;
}

/* CLEAR BUTTON (ROYAL RED) */
.royal-btn.danger{
background:linear-gradient(135deg,#ff416c,#ff4b2b);
color:white;
box-shadow:0 0 20px rgba(255,75,43,0.5);
}

.royal-btn.danger:hover{
transform:translateY(-2px) scale(1.05);
box-shadow:0 0 30px rgba(255,75,43,0.8);
}

/* EXPORT BUTTON (ROYAL BLUE/GOLD MIX) */
.royal-btn.success{
background:linear-gradient(135deg,#00c6ff,#0072ff);
color:white;
box-shadow:0 0 20px rgba(0,114,255,0.5);
}

.royal-btn.success:hover{
transform:translateY(-2px) scale(1.05);
box-shadow:0 0 30px rgba(0,114,255,0.8);
}

/* ===== MODE TOGGLE BUTTON ===== */
.mode-toggle{
padding:10px 16px;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:600;
color:white;
background:linear-gradient(135deg,#1e3a8a,#0ea5e9);
box-shadow:0 0 15px rgba(14,165,233,0.5);
transition:0.4s;
position:relative;
overflow:hidden;
}

/* glow animation */
.mode-toggle::after{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
transition:0.6s;
}

.mode-toggle:hover::after{
left:100%;
}

.mode-toggle:hover{
transform:scale(1.05);
box-shadow:0 0 25px rgba(14,165,233,0.9);
}

/* ===== DARK / LIGHT THEME ANIMATION ===== */
body{
transition:0.6s ease-in-out;
}

/* LIGHT MODE */
body.light{
background:linear-gradient(135deg,#e0f2fe,#f8fafc);
color:black;
}

/* LIGHT MODE TABLE FIX */
body.light .card{
background:white;
color:black;
}

body.light th{
background:#0ea5e9;
color:white;
}

body.light tr:hover{
background:rgba(14,165,233,0.1);
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
<h1>📊 History Panel</h1>
<button class="mode-toggle" onclick="toggleMode()">🌙 Dark Mode</button>
</div>

<!-- STATS -->
<div class="action-bar">

<button class="royal-btn danger" onclick="clearHistory()">
🗑 Clear History
</button>

<button class="royal-btn success" onclick="exportExcel()">
📥 Export Data
</button>

</div>

<input type="text" class="search" placeholder="Search..." onkeyup="searchTable(this)">

<!-- ATTENDANCE -->
<div class="card">
<h2>📅 Attendance</h2>
<table id="attendanceTable">
<tr><th>Name</th><th>Dept</th><th>Date</th><th>Time</th></tr>

{% for row in attendance %}
<tr>
<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>
</tr>
{% endfor %}

</table>
</div>

</div>

<script>
function searchTable(input){
let filter=input.value.toLowerCase();
let tables=document.querySelectorAll("table");

tables.forEach(table=>{
let rows=table.getElementsByTagName("tr");

for(let i=1;i<rows.length;i++){
let text=rows[i].innerText.toLowerCase();
rows[i].style.display=text.includes(filter)?"":"none";
}
});
}

window.onload=function(){


}
<script>

/* CLEAR HISTORY */
function clearHistory(){
    if(!confirm("Delete all attendance history?")) return;

    fetch("/clear_history", {
        method: "POST"
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success"){
            alert("✅ History cleared");
            location.reload();
        }
    })
    .catch(err => {
        console.log(err);
        alert("❌ Error clearing history");
    });
}

/* EXPORT EXCEL */
function exportExcel(){
    window.location.href = "/export_excel";
}

// ===== DARK / LIGHT MODE TOGGLE =====
function toggleMode(){
    document.body.classList.toggle("light");

    let mode = document.body.classList.contains("light") ? "light" : "dark";
    localStorage.setItem("mode", mode);
}

// load saved mode
window.onload = function(){
    let savedMode = localStorage.getItem("mode");

    if(savedMode === "light"){
        document.body.classList.add("light");
    }
}
</script>

</body>
</html>
